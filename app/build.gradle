plugins {
    id 'com.android.application'
}

def externalBuildDir = System.getenv("AIQUIZ_BUILD_DIR")
if (externalBuildDir != null && !externalBuildDir.isBlank()) {
    layout.buildDirectory.set(file(externalBuildDir))
}

// 签名文件与密码只保存在本机，不进入版本库。
// 已分发的 Android Studio Signed APK 使用 ../app_sign.jks (alias key0)。
// 默认沿用已分发签名；不能回退到 keystore/aiquizlite.jks。
// scripts/build-device-release.ps1 从本机 DPAPI 文件解密并注入环境变量，密码不写入源码。
def signingProps = new Properties()
def signingPropsFile = rootProject.file('local.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def releaseKeystoreFile = rootProject.file(System.getenv('AIQUIZ_RELEASE_STORE_FILE')
        ?: signingProps.getProperty('aiquizlite.storeFile', '../app_sign.jks'))
def releaseKeyAlias = System.getenv('AIQUIZ_RELEASE_KEY_ALIAS')
        ?: signingProps.getProperty('aiquizlite.keyAlias', 'key0')
def releaseStorePassword = System.getenv('AIQUIZ_RELEASE_STORE_PASSWORD')
        ?: signingProps.getProperty('aiquizlite.storePassword', '')
def releaseKeyPassword = System.getenv('AIQUIZ_RELEASE_KEY_PASSWORD')
        ?: signingProps.getProperty('aiquizlite.keyPassword', '')
// Secret-free CI artifacts are explicitly unsigned and must never be promoted as updates.
def unsignedCi = System.getenv('AIQUIZ_CI_UNSIGNED') == 'true'

android {
    namespace 'com.example.aiquizlite'
    compileSdk 35

    signingConfigs {
        release {
            storeFile releaseKeystoreFile
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    defaultConfig {
        applicationId "com.example.aiquizlite"
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName "1.1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            signingConfig unsignedCi ? null : signingConfigs.release
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig unsignedCi ? null : signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
